<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEXREY — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080a0c;
    --surface: rgba(255,255,255,0.04);
    --surface2: rgba(255,255,255,0.07);
    --border:  rgba(255,255,255,0.08);
    --accent:  #00e5a0;
    --accent2: #00b4d8;
    --text:    #e8eaed;
    --muted:   #6b7280;
    --bubble-me:    rgba(0,229,160,0.12);
    --bubble-them:  rgba(255,255,255,0.05);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 50% 60% at 50% 100%, rgba(0,180,216,0.05) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* ===== LEFT PANEL — partners ===== */
  .panel-left {
    width: 240px;
    flex-shrink: 0;
    background: rgba(10,12,15,0.97);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }

  .panel-left-header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-left-title {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 600;
  }

  .partners-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }

  .partners-list::-webkit-scrollbar { display: none; }

  .partner-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .partner-item:hover { background: var(--surface); }

  .partner-avatar {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #1a3a3a, #1a1a3a);
    flex-shrink: 0; position: relative;
  }

  .partner-avatar .dot {
    position: absolute; bottom: -1px; right: -1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e; border: 2px solid var(--bg);
  }

  .partner-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .partner-sub { font-size: 11px; color: var(--muted); }

  /* ===== MAIN CHAT ===== */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  /* Chat header */
  .chat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    height: 64px;
    background: rgba(8,10,12,0.95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px);
    flex-shrink: 0;
  }

  .chat-header-back {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px;
    padding: 6px 8px; border-radius: 8px; transition: all 0.2s;
  }
  .chat-header-back:hover { background: var(--surface); color: var(--text); }

  .chat-header-avatar {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    opacity: 0.7; flex-shrink: 0;
  }

  .chat-header-info { flex: 1; }

  .chat-header-name {
    font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px;
  }

  .chat-header-name .touser-name { color: var(--accent); }

  .chat-header-status { font-size: 12px; color: #22c55e; }

  .chat-header-typing { font-size: 12px; color: var(--muted); font-style: italic; }

  .chat-header-actions { display: flex; gap: 8px; }

  .action-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); cursor: pointer; padding: 8px 12px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Messages area */
  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -ms-overflow-style: none; scrollbar-width: none;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,229,160,0.02) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0,180,216,0.02) 0%, transparent 50%);
  }

  .messages-area::-webkit-scrollbar { display: none; }
  #messages { display: contents; }

  /* Individual message */
  .msg {
    display: flex;
    gap: 10px;
    max-width: 70%;
    animation: msgIn 0.2s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.me {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #1a3a3a, #1a1a3a);
    flex-shrink: 0; align-self: flex-end;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 100%;
    word-break: break-word;
  }

  .msg.them .msg-bubble {
    background: var(--bubble-them);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.me .msg-bubble {
    background: var(--bubble-me);
    border: 1px solid rgba(0,229,160,0.2);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  .msg-sender {
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
    padding: 0 4px;
  }

  .msg.me .msg-sender { text-align: right; }

  /* Empty state */
  .chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 12px;
    padding: 40px;
  }

  .chat-empty-icon { font-size: 48px; opacity: 0.3; }
  .chat-empty-text { font-size: 14px; text-align: center; }

  /* Input bar */
  .input-bar {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: rgba(8,10,12,0.95);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .attach-btn {
    background: none; border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); cursor: pointer; padding: 10px 12px; font-size: 16px;
    transition: all 0.2s; flex-shrink: 0;
  }
  .attach-btn:hover { border-color: var(--accent); color: var(--accent); }

  .input-wrap {
    flex: 1;
    position: relative;
  }

  #message {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #message:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,160,0.08);
  }

  #message::placeholder { color: var(--muted); }

  #sendBtn {
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px;
    color: #080a0c; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
  }

  #sendBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,229,160,0.3); }
  #sendBtn:active { transform: translateY(0); }

  #fileInput { display: none; }

  /* ===== RIGHT PANEL — options ===== */
  .panel-right {
    width: 220px;
    flex-shrink: 0;
    background: rgba(10,12,15,0.97);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 12px;
    position: relative;
    z-index: 2;
  }

  .panel-right-title {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
    font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }

  .option-btn {
    width: 100%; padding: 12px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.2s; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }

  .option-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,229,160,0.04); }

  .option-btn.danger { border-color: rgba(255,77,109,0.2); color: #ff4d6d; margin-top: auto; }
  .option-btn.danger:hover { background: rgba(255,77,109,0.06); border-color: #ff4d6d; }

  /* Responsive */
  @media (max-width: 768px) {
    .panel-left { display: none; }
    .panel-right { display: none; }
  }

  @media (max-width: 600px) {
    .chat-header { padding: 0 12px; gap: 10px; }
    .chat-header-actions { display: none; }
    .input-bar { padding: 12px; gap: 8px; }
    #sendBtn { padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- LEFT — Partners -->
<aside class="panel-left">
  <div class="panel-left-header">
    <div class="panel-left-title">Partenaires</div>
  </div>
  <div class="partners-list">
    <ul id="listpart" style="list-style:none;padding:0;"></ul>
  </div>
</aside>

<!-- MAIN CHAT -->
<div class="chat-main">

  <div class="chat-header">
    <button class="chat-header-back" onclick="window.location.href='home.html'">←</button>
    <div class="chat-header-avatar"></div>
    <div class="chat-header-info">
      <div class="chat-header-name">
        Chat avec&nbsp;<span class="touser-name" id="toUser"></span>
      </div>
      <div class="chat-header-status" id="typingStatus">En ligne</div>
    </div>
    <div class="chat-header-actions">
      <button class="action-btn">📞 Appel(bloquer)</button>
      <button class="action-btn">📷 Vidéo(bloquer)</button>
    </div>
  </div>

  <div class="messages-area" id="messages-area">
    <div id="messages"></div>
    <div class="chat-empty" id="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-text">Aucun message pour l'instant.<br>Dites bonjour !</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.mp4,.m4a" multiple>
    <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Joindre un fichier">📎</button>
    <div class="input-wrap">
      <input id="message" type="text" placeholder="Écrire un message...">
    </div>
    <button id="sendBtn">Envoyer ↑</button>
  </div>

</div>

<!-- RIGHT — Options -->
<aside class="panel-right">
  <div class="panel-right-title">Options</div>
  <button class="option-btn">👤 Voir le profil</button>
  <button class="option-btn">🔇 Couper le son</button>
  <button class="option-btn">🗂️ Médias partagés</button>
  <button class="option-btn">📤 Partager le contact</button>
  <button class="option-btn danger">🚫 Bloquer</button>
</aside>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
<script>
// Hide empty state when messages arrive
const msgsContainer = document.getElementById('messages');
const emptyState    = document.getElementById('chat-empty');

function refreshEmpty() {
  if (emptyState && msgsContainer)
    emptyState.style.display = msgsContainer.children.length ? 'none' : 'flex';
}

if (msgsContainer) {
  new MutationObserver(refreshEmpty).observe(msgsContainer, { childList: true });
}
</script>

</body>
</html>
