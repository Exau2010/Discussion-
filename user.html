<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="description" content="discussion, réseau">
<meta name="keywords" content="JEXREY">
<link rel="icon" type="image/jpg" sizes="16x16" href="jexrey.jpg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEXREY — Mon Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080a0c;
    --surface: rgba(255,255,255,0.04);
    --border:  rgba(255,255,255,0.08);
    --accent:  #00e5a0;
    --accent2: #00b4d8;
    --text:    #e8eaed;
    --muted:   #6b7280;
    --danger:  #ff4d6d;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,229,160,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky; top: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; height: 60px;
    background: rgba(8,10,12,0.9);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px);
    z-index: 100;
  }

  .header-brand { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 4px; color: var(--accent); font-weight: 700; flex: 1; }
  .header-user { font-size: 14px; font-weight: 600; color: var(--accent); }

  .header-btn {
    padding: 8px 18px;
    background: none; border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .header-btn:hover { border-color: var(--accent); color: var(--accent); }
  .header-btn.danger { border-color: rgba(255,77,109,0.3); color: var(--danger); }
  .header-btn.danger:hover { background: rgba(255,77,109,0.08); border-color: var(--danger); }

  .profile-hero { position: relative; z-index: 1; max-width: 860px; margin: 32px auto 0; padding: 0 24px; }

  .hero-banner {
    height: 180px; border-radius: 20px 20px 0 0;
    background: linear-gradient(135deg, #0a1a2a, #0d2a1a);
    background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(0,229,160,0.15) 0%, transparent 60%), linear-gradient(135deg, #0a1a2a, #0d2a1a);
    position: relative; overflow: hidden;
  }

  .hero-banner::after {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .hero-body {
    background: rgba(10,12,15,0.97); border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 20px 20px; padding: 60px 28px 28px; position: relative;
  }

  .hero-avatar {
    position: absolute; top: -52px; left: 28px;
    width: 100px; height: 100px; border-radius: 24px;
    background-image: url("bk.png"); background-size: cover; background-position: center; background-color: #1a2a2a;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent), 0 8px 24px rgba(0,0,0,0.4);
  }

  .hero-info { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .hero-name { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .hero-handle { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .hero-bio { font-size: 13px; color: var(--muted); max-width: 400px; }
  .hero-stats { display: flex; gap: 24px; }
  .hero-stat { text-align: center; }
  .hero-stat-value { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
  .hero-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .profile-content {
    max-width: 860px; margin: 20px auto 40px; padding: 0 24px;
    display: grid; grid-template-columns: 260px 1fr; gap: 20px; position: relative; z-index: 1;
  }

  .profile-sidebar { display: flex; flex-direction: column; gap: 16px; }

  .info-card {
    background: rgba(10,12,15,0.97); border: 1px solid var(--border); border-radius: 18px; padding: 20px;
  }

  .info-card-title {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
    font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }

  .info-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .info-row:last-child { border-bottom: none; }

  .info-icon { width: 32px; height: 32px; background: var(--surface); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .info-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }

  .info-value {
    width: 100%; background: none; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 0; transition: color 0.2s;
  }
  .info-value::placeholder { color: var(--muted); font-style: italic; }
  .info-value:focus { color: var(--accent); }

  .profile-main { display: flex; flex-direction: column; gap: 16px; }

  .content-card {
    background: rgba(10,12,15,0.97); border: 1px solid var(--border); border-radius: 18px; padding: 20px; min-height: 100px;
    position: relative; overflow: hidden; transition: border-color 0.3s;
  }
  .content-card:hover { border-color: rgba(0,229,160,0.2); }
  .content-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.3s; }
  .content-card:hover::before { opacity: 1; }

  .card-tag { display: inline-block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); background: rgba(0,229,160,0.08); border: 1px solid rgba(0,229,160,0.2); border-radius: 20px; padding: 3px 10px; margin-bottom: 12px; font-weight: 600; }
  .card-empty { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
  .card-empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.4; }

  .badge-wip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; margin-top: 8px; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  @media (max-width: 768px) { .profile-content { grid-template-columns: 1fr; } .hero-info { flex-direction: column; } }
  @media (max-width: 480px) { .profile-hero { padding: 0 12px; margin-top: 16px; } .profile-content { padding: 0 12px; } .hero-banner { height: 120px; } header { padding: 0 16px; gap: 8px; } }
</style>
</head>
<body>

<header>
  <div class="header-brand">JEXREY</div>
  <span class="header-user" id="user"></span>
  <button class="header-btn" onclick="goHome()">🏠 Accueil</button>
  <button class="header-btn danger" onclick="deleteOwnAccount()">Supprimer mon compte</button>
  <button class="header-btn danger" onclick="logout()">Déconnexion</button>
</header>

<div class="profile-hero">
  <div class="hero-banner"></div>
  <div class="hero-body">
    <div class="hero-avatar"></div>
    <div class="hero-info">
      <div>
        <div class="hero-name" id="user1"></div>
        <div class="hero-handle">@<span id="hero-handle-text"></span></div>
        <div class="hero-bio">Membre de la communauté JEXREY</div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hero-stat-value">133</div><div class="hero-stat-label">Amis</div></div>
        <div class="hero-stat"><div class="hero-stat-value">15</div><div class="hero-stat-label">Pubs</div></div>
        <div class="hero-stat"><div class="hero-stat-value">0</div><div class="hero-stat-label">Vues</div></div>
      </div>
    </div>
  </div>
</div>

<div class="profile-content">
  <div class="profile-sidebar">
    <div class="info-card">
      <div class="info-card-title">Mes informations</div>
      <div class="info-row">
        <div class="info-icon">👤</div>
        <div style="flex:1"><div class="info-label">Prénom</div><input class="info-value" type="text" placeholder="Votre prénom..."></div>
      </div>
      <div class="info-row">
        <div class="info-icon">🎂</div>
        <div style="flex:1"><div class="info-label">Âge</div><input class="info-value" type="text" placeholder="Votre âge..."></div>
      </div>
      <div class="info-row">
        <div class="info-icon">💼</div>
        <div style="flex:1"><div class="info-label">Profession</div><input class="info-value" type="text" placeholder="Votre métier..."></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📅</div>
        <div style="flex:1"><div class="info-label">Anniversaire</div><input class="info-value" type="text" placeholder="JJ / MM / AAAA"></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div style="flex:1"><div class="info-label">Ville</div><input class="info-value" type="text" placeholder="Votre ville..."></div>
      </div>
      <div class="info-row">
        <div class="info-icon">❤️</div>
        <div style="flex:1"><div class="info-label">Situation</div><input class="info-value" type="text" placeholder="Célib / En couple..."></div>
      </div>
    </div>
  </div>

  <div class="profile-main">
    <div class="content-card">
      <div class="card-tag">Publications</div>
      <div class="card-empty"><div class="card-empty-icon">📝</div>Aucune publication pour l'instant</div>
    </div>
    <div class="content-card">
      <div class="card-tag">Partenaires</div>
      <div class="card-empty"><div class="card-empty-icon">👥</div>Aucun partenaire pour l'instant</div>
    </div>
    <div class="content-card">
      <div class="card-tag">News</div>
      <div class="card-empty"><div class="card-empty-icon">📰</div>Aucune news partagée</div>
    </div>
    <div class="content-card" style="opacity:0.5;">
      <div class="card-tag">Shorts</div>
      <div class="card-empty"><div class="badge-wip"><div class="badge-dot"></div>Bientôt disponible</div></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
<script>
  const rawUser = localStorage.getItem('user') || '';
  const handleEl = document.getElementById('hero-handle-text');
  if (handleEl) handleEl.textContent = rawUser.toLowerCase().replace(/\s+/g, '_');
</script>
</body>
</html>
