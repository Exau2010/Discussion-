<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEXREY — Membres</title>
<link rel="icon" type="image/jpg" href="jexrey.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080a0c;
    --surface: rgba(255,255,255,0.04);
    --border:  rgba(255,255,255,0.08);
    --accent:  #00e5a0;
    --accent2: #00b4d8;
    --text:    #e8eaed;
    --muted:   #6b7280;
    --online:  #22c55e;
    --offline: #4b5563;
  }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 50% 40% at 90% 10%, rgba(0,180,216,0.06), transparent 60%);
    pointer-events: none;
  }

  /* HEADER */
  header {
    position: sticky; top: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px; height: 64px;
    background: rgba(8,10,12,0.92); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px); z-index: 80;
  }
  .header-brand { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 3px; color: var(--accent); flex: 1; }
  .back-btn {
    background: none; border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); cursor: pointer; padding: 8px 14px; font-size: 14px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .search-wrap { position: relative; }
  .search-wrap input {
    padding: 10px 16px 10px 38px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
    transition: border-color 0.2s; min-width: 180px;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

  /* MAIN */
  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 28px 20px; }

  .page-title { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 20px; }

  /* FILTERS */
  .filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .filter-btn.active { background: rgba(0,229,160,0.1); border-color: rgba(0,229,160,0.3); color: var(--accent); }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* GRID */
  .users-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .user-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: pointer; transition: all 0.25s; position: relative;
  }
  .user-card:hover {
    border-color: var(--accent); transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,229,160,0.12);
  }

  .user-card-avatar {
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(135deg, #1a3a3a, #1a1a3a);
    border: 2px solid var(--border); overflow: hidden;
    position: relative; transition: border-color 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: var(--accent);
  }
  .user-card:hover .user-card-avatar { border-color: var(--accent); }
  .user-card-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; position: absolute; inset: 0; }

  .status-dot {
    position: absolute; bottom: 3px; right: 3px;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .status-dot.online  { background: var(--online); }
  .status-dot.offline { background: var(--offline); }

  .user-card-name { font-size: 13px; font-weight: 600; color: var(--text); text-align: center; word-break: break-word; }
  .user-card-status { font-size: 11px; color: var(--muted); }
  .user-card-status.online { color: var(--online); }

  .user-card-actions { display: flex; gap: 6px; margin-top: 4px; width: 100%; }
  .card-action-btn {
    flex: 1; padding: 8px 6px; background: none;
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .card-action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-action-btn.chat:hover { background: rgba(0,229,160,0.06); }
  .card-action-btn.del { border-color: rgba(255,77,109,0.2); color: rgba(255,77,109,0.7); }
  .card-action-btn.del:hover { border-color: #ff4d6d; color: #ff4d6d; background: rgba(255,77,109,0.06); }

  /* Skeleton */
  .skel-card { height: 190px; background: rgba(255,255,255,0.04); border-radius: 20px; animation: skpulse 1.2s infinite; }
  @keyframes skpulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* Empty */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-text { font-size: 15px; }

  @media (max-width: 500px) {
    .search-wrap input { min-width: 130px; }
    .users-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="window.location.href='home.html'">← Accueil</button>
  <span class="header-brand">MEMBRES</span>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Rechercher..." oninput="filterUsers(this.value)">
  </div>
</header>

<main>
  <div class="page-title">Communauté JEXREY</div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Tous</button>
    <button class="filter-btn" onclick="setFilter('online', this)">🟢 En ligne</button>
    <button class="filter-btn" onclick="setFilter('offline', this)">⚫ Hors ligne</button>
  </div>

  <div class="users-grid" id="usersGrid">
    <!-- Skeletons -->
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
  </div>
</main>

<script src="/socket.io/socket.io.js" defer></script>
<script src="script.js" defer></script>
<script>
const currentUser = localStorage.getItem('user') || '';
const isAdmin     = localStorage.getItem('isAdmin') === 'true';
let allUsers      = [];
let avatarCache   = {};
let activeFilter  = 'all';
let searchQuery   = '';

// ===== FETCH AVATARS =====
async function fetchAvatars(usernames) {
  const toLoad = usernames.filter(u => !(u in avatarCache));
  if (!toLoad.length) return;
  try {
    const r = await fetch('/api/avatars/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usernames: toLoad }) });
    const d = await r.json();
    toLoad.forEach(u => { avatarCache[u] = d[u] || ''; });
  } catch { toLoad.forEach(u => { avatarCache[u] = ''; }); }
}

// ===== FILTER =====
function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function filterUsers(val) {
  searchQuery = val.toLowerCase();
  renderGrid();
}

function getFiltered() {
  return allUsers.filter(u => {
    if (u.username === currentUser) return false;
    const matchSearch = !searchQuery || u.username.toLowerCase().includes(searchQuery);
    const matchFilter = activeFilter === 'all' ||
      (activeFilter === 'online' && u.online) ||
      (activeFilter === 'offline' && !u.online);
    return matchSearch && matchFilter;
  });
}

// ===== RENDER =====
function renderGrid() {
  const grid    = document.getElementById('usersGrid');
  const filtered = getFiltered();
  grid.innerHTML = '';

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">👥</div><div class="empty-text">Aucun membre trouvé</div></div>`;
    return;
  }

  filtered.forEach(u => {
    const av       = avatarCache[u.username] || '';
    const initial  = u.username[0]?.toUpperCase() || '?';
    const card = document.createElement('div');
    card.className = 'user-card';
    card.setAttribute('data-username', u.username);
    card.innerHTML = `
      <div class="user-card-avatar">
        ${av ? `<img src="${av}" alt="">` : `<span>${initial}</span>`}
        <span class="status-dot ${u.online ? 'online' : 'offline'}"></span>
      </div>
      <div class="user-card-name">${u.username}</div>
      <div class="user-card-status ${u.online ? 'online' : ''}">${u.online ? '● En ligne' : '● Hors ligne'}</div>
      <div class="user-card-actions">
        <button class="card-action-btn chat" onclick="startChat(event,'${u.username}')">💬 Chat</button>
        <button class="card-action-btn" onclick="viewProfile(event,'${u.username}')">👤 Profil</button>
        ${isAdmin ? `<button class="card-action-btn del" onclick="deleteUser(event,'${u.username}')">🗑️</button>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

function startChat(e, username) { e.stopPropagation(); localStorage.setItem('toUser', username); window.location.href = 'chat.html'; }
function viewProfile(e, username) { e.stopPropagation(); localStorage.setItem('selectedUser', username); window.location.href = 'profile.html'; }

async function deleteUser(e, username) {
  e.stopPropagation();
  if (!confirm(`Supprimer le compte de ${username} ?`)) return;
  try {
    const res = await fetch('/api/admin/delete-user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminUsername: currentUser, targetUsername: username }) });
    const d   = await res.json();
    if (d.success) alert('Compte supprimé.');
    else alert(d.error);
  } catch { alert('Erreur réseau'); }
}

// ===== SOCKET =====
if (typeof socket !== 'undefined' && socket) {
  function joinAndGet() { socket.emit('join', currentUser); socket.emit('getUsers'); }
  socket.on('connect', joinAndGet);
  if (socket.connected) joinAndGet();

  socket.on('users', async users => {
    allUsers = users;
    await fetchAvatars(users.map(u => u.username));
    renderGrid();
  });

  socket.on('avatarUpdated', ({ username, avatar }) => {
    avatarCache[username] = avatar;
    const img = document.querySelector(`[data-username="${username}"] .user-card-avatar img`);
    if (img) { img.src = avatar; }
    else {
      const span = document.querySelector(`[data-username="${username}"] .user-card-avatar span`);
      if (span && avatar) {
        const newImg = document.createElement('img');
        newImg.src = avatar; newImg.alt = '';
        span.replaceWith(newImg);
      }
    }
  });

  socket.on('userDeleted', deletedUser => {
    if (deletedUser === currentUser) { localStorage.clear(); location.href = 'index.html'; }
    else { socket.emit('getUsers'); }
  });

  // Fallback HTTP
  setTimeout(async () => {
    if (!allUsers.length) {
      try {
        const r = await fetch('/api/users');
        if (r.ok) {
          allUsers = await r.json();
          await fetchAvatars(allUsers.map(u => u.username));
          renderGrid();
        }
      } catch {}
    }
  }, 3000);
}
</script>
</body>
</html>
