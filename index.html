<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="description" content="JEXREY — Connexion">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEXREY</title>
<link rel="icon" type="image/jpg" sizes="16x16" href="jexrey.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #080a0c;
    --surface: rgba(255,255,255,0.04);
    --border:  rgba(255,255,255,0.08);
    --accent:  #00e5a0;
    --accent2: #00b4d8;
    --text:    #e8eaed;
    --muted:   #6b7280;
  }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    position: relative; overflow-x: hidden;
  }

  /* Ambient glow */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 20%, rgba(0,180,216,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 90% 80%, rgba(0,229,160,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Floating particles */
  .particles {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
  }
  .particle {
    position: absolute; border-radius: 50%;
    background: var(--accent); opacity: 0;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) scale(0); }
    10%  { opacity: 0.3; }
    90%  { opacity: 0.1; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1); }
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
  }

  /* Brand */
  .brand {
    text-align: center; margin-bottom: 40px;
  }
  .brand-logo {
    width: 64px; height: 64px; border-radius: 18px;
    margin: 0 auto 16px;
    box-shadow: 0 0 0 3px rgba(0,229,160,0.2), 0 12px 40px rgba(0,0,0,0.5);
    display: block;
    object-fit: cover;
  }
  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: 28px; letter-spacing: 8px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block; margin-bottom: 6px;
  }
  .brand-sub {
    font-size: 13px; color: var(--muted); letter-spacing: 1px;
  }

  /* Card */
  .card {
    background: rgba(12,14,18,0.9);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.4);
  }

  /* Tabs */
  .tabs {
    display: flex; gap: 0; margin-bottom: 28px;
    background: var(--surface); border-radius: 14px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .tab-btn {
    flex: 1; padding: 12px; background: none;
    border: none; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; color: var(--muted);
    cursor: pointer; transition: all 0.25s;
    border-radius: 12px; margin: 3px;
  }
  .tab-btn.active {
    background: rgba(0,229,160,0.1);
    color: var(--accent);
    box-shadow: 0 0 0 1px rgba(0,229,160,0.2);
  }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  .panel-title {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin-bottom: 20px;
  }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; font-weight: 500; letter-spacing: 0.5px; }
  .form-input {
    width: 100%; padding: 13px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,160,0.08); }
  .form-input::placeholder { color: var(--muted); }

  /* Button */
  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px;
    color: #080a0c; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.25s; letter-spacing: 0.5px;
    margin-top: 6px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,229,160,0.3); }
  .btn-primary:active { transform: translateY(0); }

  .btn-primary.loading {
    opacity: 0.7; pointer-events: none;
  }
  .btn-primary.loading::after {
    content: ' ⏳';
  }

  /* Error */
  .error-msg {
    display: none; padding: 10px 14px;
    background: rgba(255,77,109,0.08);
    border: 1px solid rgba(255,77,109,0.2);
    border-radius: 10px; color: #ff4d6d;
    font-size: 13px; margin-bottom: 14px;
    animation: shake 0.3s ease;
  }
  .error-msg.show { display: block; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-6px)} 50%{transform:translateX(6px)} }

  /* Success */
  .success-msg {
    display: none; padding: 10px 14px;
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.2);
    border-radius: 10px; color: var(--accent);
    font-size: 13px; margin-bottom: 14px;
  }
  .success-msg.show { display: block; }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 12px; margin: 20px 0;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: 12px; color: var(--muted); }

  .footer-text { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.6; }

  @media (max-width: 440px) { .card { padding: 24px 20px; } }

  .input-eye-wrap { position: relative; }
  .input-eye-wrap .form-input { padding-right: 44px; }
  .eye-btn {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 17px; padding: 2px; transition: color 0.2s; line-height: 1;
  }
  .eye-btn:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="brand">
    <img src="jexrey.jpg" alt="JEXREY" class="brand-logo" onerror="this.style.display='none'">
    <span class="brand-name">JEXREY</span>
    <span class="brand-sub">Votre espace de connexion</span>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login', this)">Connexion</button>
      <button class="tab-btn" onclick="switchTab('register', this)">Inscription</button>
    </div>

    <!-- LOGIN -->
    <div class="panel active" id="panel-login">
      <div class="panel-title">Bienvenue</div>
      <div class="error-msg" id="login-error"></div>

      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input class="form-input" id="login-username" type="text" placeholder="Votre pseudo..." autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-eye-wrap">
          <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="eye-btn" type="button" onclick="toggleEye('login-password', this)" tabindex="-1">👁️</button>
        </div>
      </div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Se connecter →</button>
    </div>

    <!-- REGISTER -->
    <div class="panel" id="panel-register">
      <div class="panel-title">Créer un compte</div>
      <div class="error-msg" id="register-error"></div>
      <div class="success-msg" id="register-success"></div>

      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input class="form-input" id="register-username" type="text" placeholder="Choisissez un pseudo..." autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-eye-wrap">
          <input class="form-input" id="register-password" type="password" placeholder="Minimum 6 caractères" autocomplete="new-password">
          <button class="eye-btn" type="button" onclick="toggleEye('register-password', this)" tabindex="-1">👁️</button>
        </div>
      </div>
      <button class="btn-primary" id="register-btn" onclick="doRegister()">Créer mon compte →</button>
    </div>
  </div>

  <div class="footer-text">En utilisant JEXREY, vous acceptez nos conditions d'utilisation.<br>© 2024 JEXREY</div>
</div>

<script>
// Redirect si déjà connecté
if (localStorage.getItem('user')) window.location.href = 'home.html';

// Particles
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 1;
    p.style.width  = size + 'px';
    p.style.height = size + 'px';
    p.style.left   = Math.random() * 100 + 'vw';
    p.style.bottom = '-10px';
    p.style.animationDuration  = (Math.random() * 15 + 10) + 's';
    p.style.animationDelay     = (Math.random() * 10) + 's';
    p.style.background = Math.random() > 0.5 ? '#00e5a0' : '#00b4d8';
    container.appendChild(p);
  }
}
createParticles();

// Tabs
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  // Clear errors
  document.querySelectorAll('.error-msg, .success-msg').forEach(el => el.classList.remove('show'));
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginPanel = document.getElementById('panel-login');
  if (loginPanel.classList.contains('active')) doLogin();
  else doRegister();
});

// LOGIN
async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');

  errEl.classList.remove('show');
  if (!username || !password) { errEl.textContent = 'Veuillez remplir tous les champs.'; errEl.classList.add('show'); return; }

  btn.classList.add('loading'); btn.textContent = 'Connexion...';

  try {
    const res  = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (data.error) {
      errEl.textContent = data.error; errEl.classList.add('show');
      btn.classList.remove('loading'); btn.textContent = 'Se connecter →'; return;
    }
    localStorage.setItem('user', username);
    if (data.isAdmin) localStorage.setItem('isAdmin', 'true'); else localStorage.removeItem('isAdmin');
    window.location.href = 'home.html';
  } catch {
    errEl.textContent = 'Erreur réseau, réessayez.'; errEl.classList.add('show');
    btn.classList.remove('loading'); btn.textContent = 'Se connecter →';
  }
}

// TOGGLE PASSWORD VISIBILITY
function toggleEye(inputId, btn) {
  const input = document.getElementById(inputId);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁️';
}

// REGISTER
async function doRegister() {
  const username  = document.getElementById('register-username').value.trim();
  const password  = document.getElementById('register-password').value;
  const errEl     = document.getElementById('register-error');
  const successEl = document.getElementById('register-success');
  const btn       = document.getElementById('register-btn');

  errEl.classList.remove('show'); successEl.classList.remove('show');
  if (!username || !password) { errEl.textContent = 'Veuillez remplir tous les champs.'; errEl.classList.add('show'); return; }
  if (password.length < 6) { errEl.textContent = 'Mot de passe trop court (min. 6 caractères).'; errEl.classList.add('show'); return; }

  btn.classList.add('loading'); btn.textContent = 'Création...';

  try {
    const res  = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (data.error) {
      errEl.textContent = data.error; errEl.classList.add('show');
      btn.classList.remove('loading'); btn.textContent = 'Créer mon compte →'; return;
    }
    successEl.textContent = '✓ Compte créé ! Connectez-vous maintenant.';
    successEl.classList.add('show');
    document.getElementById('register-username').value = '';
    document.getElementById('register-password').value = '';
    btn.classList.remove('loading'); btn.textContent = 'Créer mon compte →';
    setTimeout(() => {
      document.querySelector('[onclick="switchTab(\'login\', this)"]').click();
      document.getElementById('login-username').value = username;
    }, 1200);
  } catch {
    errEl.textContent = 'Erreur réseau, réessayez.'; errEl.classList.add('show');
    btn.classList.remove('loading'); btn.textContent = 'Créer mon compte →';
  }
}
</script>
</body>
</html>
