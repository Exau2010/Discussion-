<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="description" content="discussion, réseau">
<meta name="keywords" content="JEXREY">
<link rel="icon" type="image/jpg" sizes="16x16" href="jexrey.jpg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEXREY connection</title>
<style>
 body {
  background: black;
  color: white;
  font-family: sans-serif;
  align-content: center;
  justify-content: center;
  justify-items: center;
 }

 nav {
  display: flex;
  align-content: center;
  align-items: center;
  gap: 10px;
 }

 .prest {
  align-conetnt: center;
  align-items: center;
  justify-content: center;
  justify-items: center;
  text-align: center;
  margin-top: center;
  transition: 1s;
  animation: text 1s ease;
  text-shadow: 0 2px 10px lightgrey;
 }

 @keyframes text{
  from{opacity: 0; transform: translateY(-100px);}
  to{opacity: 1; transform: translateY(0);}
 }

 .connect {
  display: grid;
  width: 75%;
  padding: 20px;
  align-content: center;
  text-align: center;
  animation: content 1.5s ease;
 }

 @keyframes content{
  from{opacity: 0; transform: translateX(-100px);}
  to{opacity: 1; transform: translateX(0);}
 }

 .connect input {
  margin-top: 10px;
  padding: 15px;
  background: none;
  border-radius: 20px;
  border: 1px solid grey;
  outline: none;
  color: white;
 }

 .password-div {
  width: 100%;
  display: flex;
 }

 .password-div #password {
  flex-shrink: 0;
  width: 91%;
 }


 .password-div #check{
  position: relative;
  right: 30px;
 }

 .connect button {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid #458966;
  background: none;
  cursor: pointer;
  border-radius: 10px;
  color: #458966;
  outline: none;
 }

 .connect button:hover {
  background: #187043ff;
  color: white;
 }
 .connect #anul {
  border: 1px solid red;
  color: red;
  display: none;
  bckground: none;
 }

 .connect #anul:hover {
  background: red;
  color: white;
 }

 .inscrit {
  margin-top: 20%;
  margin-left: 50%;
 }

 .inscrit button {
  background: none;
  border: none;
  cursor: pointer;
  color: #458966;
 }

 nav img {
  border-radius: 10px;
 }

 #register {
  display: none;
 }

 @media (max-width: 2040px){
  .prest {
    margin-top: 5%;
  }

  .connect {
    width: 30%;
  }

  .inscrit {
    margin-top: 7%;
  }

 }

 @media (max-width: 1140px){
  .prest {
    margin-top: 10%;
  }

  .connect {
    width: 50%;
  }

  .inscrit {
    margin-top: 10%;
  }

 }

 @media (max-width: 767px){
  .connect {
    width: 75%;
  }
  
  .prest {
   margin-top: 20%;
  }
  
 }

 
 
</style>
</head>
<body id="body">
  <nav>
    <img src="jexrey.jpg" width="40" height="40"><h5>JEXREY</h5>
  </nav>

  <div class="prest">
    <h1 id="prest">Bienvenue sur notre plateforme</h1>
  </div>

  <div class="connect" id="connect">
    <h4 id="inp">Connectez-vous</h4>
    <input  id="username" placeholder="Saisissez votre pseudo...">
    <div class="password-div">
      <input type="password" id="password" placeholder="Saisissez votre password...">
      <input type="checkbox" id="check" onclick="password.type= this.checked ? 'text' : 'password'">
    </div>
    <input type="email" id="email" placeholder="Saisissez votre e-mail...">
    <button type="login" id="login" onclick="login()">Se connecter</button>
    <button  id="register" onclick="register()">Créé le compte</button>
    <button  id="anul" onclick="anul()">Annuler</button>
  </div>

  <div class="inscrit">
    <button id="regis" onclick="regis()">---- S'inscrire ----</button>
  </div>


<script src="script.js"></script>
</body>
</html>
